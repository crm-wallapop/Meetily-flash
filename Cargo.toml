[workspace]
resolver = "2"
members = [
    "frontend/src-tauri",
    "llama-helper",
    # Dev-only cosine-equivalence harness. NOT part of any production build path.
    # sherpa-onnx (bundled ORT 1.17.1, C-API 17) and the `ort` crate (C-API 27)
    # cannot coexist in one process, so each probe crate is a standalone binary
    # that a parent process shells out to. See embed-probe-sherpa/src/main.rs
    # header for the full rationale.
    "embed-probe-sherpa",
    "embed-probe-ort",
]

# Shared workspace settings
[workspace.package]
edition = "2021"
rust-version = "1.77"

# Shared dependencies that can be inherited by workspace members
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }
